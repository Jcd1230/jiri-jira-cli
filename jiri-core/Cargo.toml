[package]
name = "jiri-core"
version = "0.2.0"
authors = ["Jason Dogariu <jdogariu@gmail.com>"]
license = "MIT"
edition = "2021"
description = "Core library for jiri — Atlassian Cloud client (Jira + Confluence)"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
comfy-table = ">=7.1, <7.2"
base64 = "0.22"
pulldown-cmark = "0.13.3"
urlencoding = "2.1.3"
mime_guess = "2.0"

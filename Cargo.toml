[workspace]
members = ["jiri-core"]

[package]
name = "jiri-jira-cli"
version = "0.2.0"
authors = ["Jason Dogariu <jdogariu@gmail.com>"]
license = "MIT"
edition = "2021"

[[bin]]
name = "jiri"
path = "src/main.rs"

[dependencies]
jiri-core = { path = "jiri-core" }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
tokio = { version = "1.40", features = ["full"] }
serde_json = "1.0"
textwrap = "0.16"
owo-colors = "4.2"
